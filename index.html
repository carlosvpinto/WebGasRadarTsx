    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            const origFetch = window.fetch;
            let currentFetch = origFetch ? origFetch.bind(window) : undefined;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              // Ignore if already configurable or non-redefinable
            }
          }
        } catch (e) {}
      })();
    </script>
